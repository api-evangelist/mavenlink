apis:
- name: Kantata OX API
  description: >-
    REST API for the Kantata OX (formerly Mavenlink) professional services automation platform. 419 operations
    across 218 paths cover workspaces (projects), stories (tasks), assignments, time entries, timesheets and
    approvals, expenses and expense reports, invoices and billing milestones, estimates and estimate scenarios,
    rate cards and cost rates, resource requests and allocations, custom fields, users and account memberships,
    Insights reports, data exports, and a nine-day Subscribed Events change feed. JSON responses use a
    side-loaded envelope (results[] plus id-keyed top-level collections) with page/per_page or limit/offset
    pagination, include= association expansion, and optional_fields= sparse field selection.
  humanURL: https://developer.kantata.com/
  baseURL: https://api.mavenlink.com/api/v1/
  tags:
  - Professional Services Automation
  - Project Management
  - Resource Management
  - Time Tracking
  - Expense Management
  - Invoicing
  - Project Accounting
