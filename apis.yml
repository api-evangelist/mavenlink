- name: Kantata OX MCP Server
  description: >-
    Remote Model Context Protocol server operated by Kantata on the Mavenlink API host. Advertised anonymously
    through RFC 9728 protected-resource metadata at https://api.mavenlink.com/.well-known/oauth-protected-resource
    and guarded by the same Doorkeeper OAuth 2.0 authorization server as the REST API, with a dedicated `mcp`
    scope and PKCE (S256). tools/list returns HTTP 401 with a Bearer/invalid_token challenge to anonymous
    callers, so the live tool schemas require an authorized Kantata OX account.
  humanURL: https://developer.kantata.com/
  baseURL: https://api.mavenlink.com/mcp
  tags:
  - MCP
  - agent-native
  - Professional Services Automation
  properties:
  - type: MCPServer
    url: mcp/mavenlink-mcp.yml
  - type: MCPServer
    url: https://api.mavenlink.com/mcp
  - type: ToolCrosswalk
    url: mcp/mavenlink-tool-crosswalk.yml
  - type: OAuthScopes
    url: scopes/mavenlink-scopes.yml
- name: Kantata OX Developer Documentation Agent
  description: >-
    Agent surface published on the Kantata developer portal. Serves an A2A agent card at
    /.well-known/agent-card.json (protocolVersion 0.3.0) that advertises an MCP extension, and an anonymous
    documentation MCP server at https://developer.kantata.com/mcp exposing six read-only tools for listing APIs,
    enumerating endpoints, retrieving endpoint detail and security schemes, downloading the full OpenAPI, and
    searching the documentation. It answers questions about the API; it does not read or write Kantata OX data.
  humanURL: https://developer.kantata.com/
  baseURL: https://developer.kantata.com/mcp
  tags:
  - MCP
  - agent-native
  - Documentation
  properties:
  - type: AgentCard
    url: a2a/mavenlink-a2a.yml
  - type: MCPServer
    url: https://developer.kantata.com/mcp
  - type: LLMsTxt
    url: https://developer.kantata.com/llms.txt
