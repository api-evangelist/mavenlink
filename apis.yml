- aid: mavenlink:mavenlink-story-dependencies-api
  name: Mavenlink Story Dependencies API
  description: >-
    Story dependencies define relationships between tasks and the sequence in which they must be completed
    in order to close a project. A dependency is between two tasks (stories) in a project (workspace),
    with one being the predecessor (source) task, and the other the successor (target) task. Each relationship
    is characterized by the type of dependency and lag between tasks. There are four (4) types of dependencies:

    - Finish to Start (FS)—The predecessor ends before the successor can begin.

    - Start to Start (SS)—The predecessor begins before the successor can begin.

    - Finish to Finish (FF)—The predecessor ends before the successor can end.

    - Start to Finish (SF)—The predecessor begins before the successor can end.

    Lag is the number of days between the predecessor task ending and the successor task beginning.

    To learn more about dependencies, see our [Gantt Chart Dependencies article](https://mavenlink.zendesk.com/hc/en-us/articles/360000456874-Gantt-Chart-Dependencies).
  humanURL: https://developer.kantata.com/
  baseURL: https://api.mavenlink.com/api/v1/
  tags:
  - Story Dependencies
  properties:
  - type: OpenAPI
    url: openapi/mavenlink-story-dependencies-api-openapi.yml
