aid: mavenlink
name: Mavenlink
description: >-
  Mavenlink is the professional services automation (PSA) platform now shipped as Kantata OX, following the 2022
  merger of Mavenlink and Kimble Applications that formed Kantata. It combines project management, resource
  management and forecasting, time and expense tracking, project accounting, invoicing, rate cards, and business
  intelligence for services organizations. The public REST API is still served from the original Mavenlink domain
  at https://api.mavenlink.com/api/v1/ and is documented as the "Kantata OX API" at developer.kantata.com: a
  Swagger 2.0 contract covering 419 operations across 218 paths and roughly 100 resource groups, authenticated with
  OAuth 2.0 authorization-code bearer tokens issued from app.mavenlink.com. Alongside REST the company operates an
  OAuth-gated remote MCP server at https://api.mavenlink.com/mcp, publishes an A2A agent card and an anonymous
  documentation MCP server on its developer portal, and ships a gRPC connector service definition that third
  parties implement to extend the Kantata Workflow Platform with custom triggers and actions.
image: https://www.kantata.com/images/logos/Kantata.png
url: https://raw.githubusercontent.com/api-evangelist/mavenlink/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
specificationVersion: '0.20'
created: '2026-08-25'
modified: '2026-08-25'
tags:
- Professional Services Automation
- Project Management
- Resource Management
- Time Tracking
- Expense Management
- Invoicing
- Project Accounting
- Business Intelligence
- Workflow Automation
- MCP
- agent-native
- Company
apis:
- name: Kantata OX MCP Server
  description: >-
    Remote Model Context Protocol server operated by Kantata on the Mavenlink API host. Advertised anonymously
    through RFC 9728 protected-resource metadata at https://api.mavenlink.com/.well-known/oauth-protected-resource
    and guarded by the same Doorkeeper OAuth 2.0 authorization server as the REST API, with a dedicated
    `mcp` scope and PKCE (S256). tools/list returns HTTP 401 with a Bearer/invalid_token challenge to
    anonymous callers, so the live tool schemas require an authorized Kantata OX account.
  humanURL: https://developer.kantata.com/
  baseURL: https://api.mavenlink.com/mcp
  tags:
  - MCP
  - agent-native
  - Professional Services Automation
  properties:
  - type: MCPServer
    url: mcp/mavenlink-mcp.yml
  - type: MCPServer
    url: https://api.mavenlink.com/mcp
  - type: ToolCrosswalk
    url: mcp/mavenlink-tool-crosswalk.yml
  - type: OAuthScopes
    url: scopes/mavenlink-scopes.yml
- name: Kantata OX Developer Documentation Agent
  description: >-
    Agent surface published on the Kantata developer portal. Serves an A2A agent card at /.well-known/agent-card.json
    (protocolVersion 0.3.0) that advertises an MCP extension, and an anonymous documentation MCP server
    at https://developer.kantata.com/mcp exposing six read-only tools for listing APIs, enumerating endpoints,
    retrieving endpoint detail and security schemes, downloading the full OpenAPI, and searching the documentation.
    It answers questions about the API; it does not read or write Kantata OX data.
  humanURL: https://developer.kantata.com/
  baseURL: https://developer.kantata.com/mcp
  tags:
  - MCP
  - agent-native
  - Documentation
  properties:
  - type: AgentCard
    url: a2a/mavenlink-a2a.yml
  - type: MCPServer
    url: https://developer.kantata.com/mcp
  - type: LLMsTxt
    url: https://developer.kantata.com/llms.txt
