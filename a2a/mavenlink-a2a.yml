- >-
  The card describes the DOCUMENTATION agent, not the Kantata OX product API. Its `url` is
  https://developer.kantata.com/a2a and its MCP extension points at https://developer.kantata.com/mcp, both of
  which answer questions ABOUT the API. The product MCP server that reads and writes Kantata OX data lives at
  https://api.mavenlink.com/mcp and is NOT referenced by any agent card - api.mavenlink.com and app.mavenlink.com
  both return 404 on /.well-known/agent-card.json and /.well-known/agent.json.
