checked: '2026-08-25'
notes: >-
  Kantata publishes NO current client SDK for the Kantata OX API. The API reference at developer.kantata.com has
  no libraries, SDKs or code-samples section at all - its only guidance is "if you are using an OAuth2 library,
  many of these steps will be handled for you." One first-party Ruby API client does exist on RubyGems under the
  Mavenlink name, but its newest release is 0.2.7 from 2012-04-10 and it is labelled ALPHA in its own repository
  description - fourteen years older than the 419-operation contract it would have to wrap. Everything else the
  mavenlink GitHub org publishes is framework or design-system code, not an API client. PyPI, Packagist,
  crates.io, NuGet, Maven Central and pkg.go.dev return nothing first-party.
