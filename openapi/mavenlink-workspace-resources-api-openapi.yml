          type: boolean
          description: 'Whether the participant has edit permissions to the project.

            Visible when the API user is an administrator on the project.'
        can_edit_expense:
          type: boolean
          description: 'Whether the participant can edit expenses in the project.

            Visible when the API user is an administrator on the project.'
        can_edit_time:
          type: boolean
