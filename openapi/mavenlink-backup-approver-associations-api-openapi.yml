openapi: 3.2.0
info:
  version: 1.0.0
  title: Kantata OX API Documentation Backup Approver Associations…
  description: Kantata OX's API provides access to the majority of Kantata OX's data model.
  termsOfService: https://www.kantata.com/terms-of-use
  contact:
    name: Kantata OX Support
    url: https://knowledge.kantata.com/hc/en-us
  license:
    name: COPYRIGHT © 2026 Kantata, Inc.
    url: https://www.kantata.com/terms-of-use
  x-logo:
    url: https://theme.zdassets.com/theme_assets/56104/04e93064d309f75d054b8cee885d1ea51e9be8f7.png
    backgroundColor: '#FFFFFF'
    altText: Kantata OX API Documentation
    href: https://developer.kantata.com
servers:
- url: https://api.mavenlink.com/api/v1
tags:
- name: Backup Approver Associations
  description: 'A Backup Approver Association represents the relationship of a delegated approver to a range of specific dates.

    Approval responsibilities are delegated to a backup approver.'
paths:
  /backup_approver_associations:
    get:
      summary: Fetching a list of Backup Approver Associations
      description: 'The index endpoint only returns backup approver associations that are visible to the user.

        Backup approver associations are only visible to account members.


        This endpoint returns structured Backup Approver Association objects.

        As with all Kantata OX API endpoints, the returned data will be referenced in sorted order in the `results` array

        and will be indexed by ID in the `backup_approver_associations` top-level JSON key.

        Please see our Response Format section for more information.'
      operationId: Get Backup Approver Associations
      tags:
      - Backup Approver Associations
      parameters:
      - in: query
        name: include
        description: 'Any of the below associations can be included in your request by providing the `include` param, e.g. `include=association1,association2`.

          - `approver` (User) - The user who would normally approve time.

          - `backup_approver` (User) - The user who will be approving time in place of the normal approver.'
        schema:
          type: string
      - in: query
        name: only
        description: 'Allows you to request one or more resources directly by ID. Multiple IDs can be supplied

          in a comma separated list, like `GET /api/v1/workspaces.json?only=5,6,7`.'
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 200
      responses:
        '200':
          description: A list of Backup Approver Associations have been retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int32
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        format: int32
                      page_count:
                        type: integer
                        format: int32
                      page_number:
                        type: integer
                        format: int32
                      page_size:
                        type: integer
                        format: int32
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        id:
                          type: string
                  backup_approver_associations:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/BackupApproverAssociation'
                  users:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: Forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: Page Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    post:
      summary: Creating a new Backup Approver Association
      description: 'This endpoint returns structured Backup Approver Association objects.

        As with all Kantata OX API endpoints, the returned data will be referenced in sorted order in the `results` array

        and will be indexed by ID in the `backup_approver_associations` top-level JSON key.

        Please see our Response Format section for more information.'
      operationId: Create Backup Approver Association
      tags:
      - Backup Approver Associations
      parameters:
      - in: query
        name: include
        description: 'Any of the below associations can be included in your request by providing the `include` param, e.g. `include=association1,association2`.

          - `approver` (User) - The user who would normally approve time.

          - `backup_approver` (User) - The user who will be approving time in place of the normal approver.'
        schema:
          type: string
      responses:
        '200':
          description: Backup Approver Association has been created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int32
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        format: int32
                      page_count:
                        type: integer
                        format: int32
                      page_number:
                        type: integer
                        format: int32
                      page_size:
                        type: integer
                        format: int32
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        id:
                          type: string
                  backup_approver_associations:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/BackupApproverAssociation'
                  users:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: Forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: Page Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                backup_approver_association:
                  type: object
                  properties:
                    backup_approver_id:
                      type: integer
                      format: int32
                      description: The ID of the user designated as backup approver.
                    approver_id:
                      type: integer
                      format: int32
                      description: The ID of the user designated as the approver.
                    start_date:
                      type: string
                      format: date
                      description: The start date on which the approver and backup approver are current. The date must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
                    end_date:
                      type: string
                      format: date
                      description: The end date on which the approver and backup approver are current. The date must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
                  required:
                  - backup_approver_id
                  - approver_id
                  - start_date
                  - end_date
        required: true
  /backup_approver_associations/{id}:
    get:
      summary: Fetching a single Backup Approver Association
      description: 'This endpoint returns structured Backup Approver Association objects.

        As with all Kantata OX API endpoints, the returned data will be referenced in sorted order in the `results` array

        and will be indexed by ID in the `backup_approver_associations` top-level JSON key.

