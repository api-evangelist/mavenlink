info:
  version: 1.0.0
  title: Kantata OX API Documentation Holiday Calendar Memberships…
  description: Kantata OX's API provides access to the majority of Kantata OX's data model.
  termsOfService: https://www.kantata.com/terms-of-use
  contact:
    name: Kantata OX Support
    url: https://knowledge.kantata.com/hc/en-us
  license:
    name: COPYRIGHT © 2026 Kantata, Inc.
    url: https://www.kantata.com/terms-of-use
  x-logo:
    url: https://theme.zdassets.com/theme_assets/56104/04e93064d309f75d054b8cee885d1ea51e9be8f7.png
    backgroundColor: '#FFFFFF'
    altText: Kantata OX API Documentation
    href: https://developer.kantata.com
servers:
- url: https://api.mavenlink.com/api/v1
tags:
- name: Holiday Calendar Memberships
  description: A list of all calendars associated to an individual user.
paths:
  /holiday_calendar_memberships:
    get:
      summary: Fetching a list of Holiday Calendar Memberships
      description: 'This endpoint returns structured Holiday Calendar Membership objects.

        As with all Kantata OX API endpoints, the returned data will be referenced in sorted order in the `results` array

        and will be indexed by ID in the `holiday_calendar_memberships` top-level JSON key.

        Please see our Response Format section for more information.'
      operationId: Get Holiday Calendar Memberships
      tags:
      - Holiday Calendar Memberships
      parameters:
      - in: query
        name: by_holiday_calendar_id
        description: Include holiday calendar memberships for the specified holiday calendar ID.
        schema:
          type: integer
          format: int32
      - in: query
        name: by_user_id
        description: Include holiday calendar memberships for the specified user ID.
        schema:
          type: integer
          format: int32
      - in: query
        name: created_after
        description: Filter for records created after a specified datetime. The datetime must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        description: Filter for records created before a specified datetime. The datetime must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
        schema:
          type: string
          format: date-time
      - in: query
        name: include
        description: 'Any of the below associations can be included in your request by providing the `include` param, e.g. `include=association1,association2`.

          - `holiday_calendar` (HolidayCalendar) - The Holiday Calendar associated with this HolidayCalendarMembership.

          - `user` (User) - The User participating in the Holiday Calendar.'
        schema:
          type: string
      - in: query
        name: only
        description: 'Allows you to request one or more resources directly by ID. Multiple IDs can be supplied

          in a comma separated list, like `GET /api/v1/workspaces.json?only=5,6,7`.'
        schema:
          type: string
      - in: query
        name: order
        description: 'Supply `order` with the name of a valid sort field for the endpoint and a direction.


          Valid values: `start_date:asc` and `start_date:desc`.'
        schema:
          type: string
          default: start_date:desc
      - in: query
        name: page
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 200
      - in: query
        name: updated_after
        description: Filter for records updated after a specified datetime. The datetime must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_before
        description: Filter for records updated before a specified datetime. The datetime must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: A list of Holiday Calendar Memberships have been retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int32
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        format: int32
                      page_count:
                        type: integer
                        format: int32
                      page_number:
                        type: integer
                        format: int32
                      page_size:
                        type: integer
                        format: int32
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        id:
                          type: string
                  holiday_calendar_memberships:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/HolidayCalendarMembership'
                  holiday_calendars:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/HolidayCalendar'
                  users:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: Forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: Page Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    post:
      summary: Creating a new Holiday Calendar Membership
      description: 'This endpoint returns structured Holiday Calendar Membership objects.

        As with all Kantata OX API endpoints, the returned data will be referenced in sorted order in the `results` array

        and will be indexed by ID in the `holiday_calendar_memberships` top-level JSON key.

        Please see our Response Format section for more information.'
      operationId: Create Holiday Calendar Membership
      tags:
      - Holiday Calendar Memberships
      parameters:
      - in: query
        name: include
        description: 'Any of the below associations can be included in your request by providing the `include` param, e.g. `include=association1,association2`.

          - `holiday_calendar` (HolidayCalendar) - The Holiday Calendar associated with this HolidayCalendarMembership.

          - `user` (User) - The User participating in the Holiday Calendar.'
        schema:
          type: string
      responses:
        '200':
          description: Holiday Calendar Membership has been created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int32
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        format: int32
                      page_count:
                        type: integer
                        format: int32
                      page_number:
                        type: integer
                        format: int32
                      page_size:
                        type: integer
                        format: int32
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        id:
                          type: string
                  holiday_calendar_memberships:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/HolidayCalendarMembership'
                  holiday_calendars:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/HolidayCalendar'
                  users:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: Forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: Page Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                holiday_calendar_membership:
                  type: object
                  properties:
                    start_date:
                      type: string
                      format: date
                      description: When the calendar begins to apply to the user. The date must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
                    holiday_calendar_id:
                      type: integer
                      format: int32
                      description: The ID of the calendar that is associated to the user.
                    user_id:
                      type: integer
                      format: int32
                      description: The ID of the user assigned to the calendar.
                  required:
                  - start_date
                  - holiday_calendar_id
                  - user_id
        required: true
  /holiday_calendar_memberships/{id}:
    get:
      summary: Fetching a single Holiday Calendar Membership
      description: 'This endpoint returns structured Holiday Calendar Membership objects.

        As with all Kantata OX API endpoints, the returned data will be referenced in sorted order in the `results` array

        and will be indexed by ID in the `holiday_calendar_memberships` top-level JSON key.

        Please see our Response Format section for more information.'
