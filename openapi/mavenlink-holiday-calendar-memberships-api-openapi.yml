      - in: query
        name: include
        description: 'Any of the below associations can be included in your request by providing the `include` param, e.g. `include=association1,association2`.

          - `holiday_calendar` (HolidayCalendar) - The Holiday Calendar associated with this HolidayCalendarMembership.

          - `user` (User) - The User participating in the Holiday Calendar.'
