          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        currency:
          type: string
        notes:
          type: string
        taxable:
          type: boolean
        workspace_id:
          type: integer
          format: int32
    BillingMilestone:
      title: Billing Milestones
      description: 'Billing milestones allow you to set up billable items in a project that are separate from the Task Tracker work and have invoicing rules.

        A set of billing milestones in a project is known as the [Billing Schedule](https://knowledge.kantata.com/hc/en-us/articles/35123275585947).'
      type: object
      properties:
        amount_in_cents:
          type: integer
          format: int32
          description: The billing milestone amount, in the subunits of the currency (e.g. cents for USD).
        billing_type:
          type: string
          description: Determines how and when we bill clients for a particular billing milestone. Possible values are `fixed_date` and `upon_completion`.
        created_at:
          type: string
          format: date-time
        currency:
          type: string
          description: The [ISO code](https://knowledge.kantata.com/hc/en-us/articles/360041576473-Supported-Currency-ISO-Codes-and-Formats) of the currency of the billing milestone.
        date_to_invoice:
          type: string
          format: date
          description: When the billing milestone becomes invoiceable.
        external_reference_ids:
          type: array
          items:
            type: string
          description: '`external_reference_ids` will only be included in the response if `external_references` is in the list of included associations. See <a href=''#section/Includes''>include</a> section for usage.'
        invoice_id:
          type: string
          description: The ID of the invoice associated with the billing milestone.
        invoice_ids:
          type: array
          items:
            type: string
          description: '`invoice_ids` will only be included in the response if `invoices` is in the list of included associations. See <a href=''#section/Includes''>include</a> section for usage.'
        story_id:
          type: string
          description: The ID of the story associated with the billing milestone. This field is required when the `billing_type` is set to `upon_completion`.
        title:
          type: string
          description: The title of the billing milestone.
        updated_at:
          type: string
          format: date-time
        workspace_id:
          type: string
          description: The ID of the workspace associated with the billing milestone.
    Invoice:
      title: Invoice
      description: An Invoice is defined as a list of costs incurred during a Kantata OX project, which are billable to an end user.
      type: object
      properties:
        additional_item_ids:
          type: array
          items:
            type: string
          description: '`additional_item_ids` will only be included in the response if `additional_items` is in the list of included associations. See <a href=''#section/Includes''>include</a> section for usage.'
        balance_in_cents:
          type: integer
          format: int32
          description: The balance, in cents, of the invoice.
        billing_milestone_ids:
          type: array
          items:
            type: string
          description: '`billing_milestone_ids` will only be included in the response if `billing_milestones` is in the list of included associations. See <a href=''#section/Includes''>include</a> section for usage.'
        created_at:
          type: string
          format: date-time
          description: The date the invoice was recorded in Kantata OX, in YY-MM-DD[T]HH:MM:SS-TIMEZONE format.
        currency:
          type: string
          description: The currency being used for the invoice.
        currency_base_unit:
          type: integer
          format: int32
          description: The number of the units in the `balance_in_cents` attribute that are required to make up a single unit of the `currency`.
        currency_symbol:
          type: string
          description: The symbol that represents the currency being used for the invoice.
        draft:
          type: boolean
          description: Whether or not the invoice is a draft.
        due_date:
          type: string
          format: date
          description: The date the invoice is due, in YYYY-MM-DD format.
        expense_ids:
          type: array
          items:
            type: string
          description: '`expense_ids` will only be included in the response if `expenses` is in the list of included associations. See <a href=''#section/Includes''>include</a> section for usage.'
        external_reference_ids:
          type: array
          items:
            type: string
          description: '`external_reference_ids` will only be included in the response if `external_references` is in the list of included associations. See <a href=''#section/Includes''>include</a> section for usage.'
        fixed_fee_item_ids:
          type: array
          items:
            type: string
          description: '`fixed_fee_item_ids` will only be included in the response if `fixed_fee_items` is in the list of included associations. See <a href=''#section/Includes''>include</a> section for usage.'
        invoice_date:
          type: string
          format: date
          description: The date the invoice was incurred, in YYYY-MM-DD format.
        message:
          type: string
          description: Any notes added to the invoice.
        payment_schedule:
          type: integer
          format: int32
          description: The number of days within which the total amount of the invoice is expected to be paid. For example, use `30` for a Net 30 payment schedule. See https://en.wikipedia.org/wiki/Net_D.
        project_code:
          type: string
          description: The invoice project code.
        purchase_order:
          type: string
          description: The invoice purchase order.
        recipient_id:
          type: string
          description: '`recipient_id` will only be included in the response if `recipient` is in the list of included associations. See <a href=''#section/Includes''>include</a> section for usage.'
        status:
          type: string
          description: The current status of the invoice ('new', 'cancelled', 'accepted payment').
        tax_rate:
          type: number
          format: float
          description: The tax rate percentage that is applied to the invoice total.
        time_entry_ids:
          type: array
          items:
            type: string
          description: '`time_entry_ids` will only be included in the response if `time_entries` is in the list of included associations. See <a href=''#section/Includes''>include</a> section for usage.'
        title:
          type: string
          description: 'The auto-generated invoice title. The format is `Invoice #[user_invoice_number]` or `Draft Invoice #[user_invoice_number]`.'
        updated_at:
          type: string
          format: date-time
          description: The date the invoice was last updated, in YY-MM-DD[T]HH:MM:SS-TIMEZONE format.
        user_id:
          type: string
          description: '`user_id` will only be included in the response if `user` is in the list of included associations. See <a href=''#section/Includes''>include</a> section for usage.'
        user_invoice_number:
          type: integer
          format: int32
          description: The invoice number.
        user_invoice_title:
          type: string
          description: The user-entered title of the invoice.
        workspace_ids:
          type: array
          items:
            type: string
          description: '`workspace_ids` will only be included in the response if `workspaces` is in the list of included associations. See <a href=''#section/Includes''>include</a> section for usage.'
  securitySchemes:
    BearerToken:
      type: apiKey
      name: Bearer
      in: header
    OauthSecurity:
      type: oauth2
      flows:
        authorizationCode:
          scopes: {}
          authorizationUrl: https://app.mavenlink.com/oauth/authorize
          tokenUrl: https://app.mavenlink.com/oauth/token
