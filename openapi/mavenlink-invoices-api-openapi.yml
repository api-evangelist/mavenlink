                      properties:
                        key:
                          type: string
                        id:
                          type: string
                  invoices:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Invoice'
                  external_references:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/ExternalReference'
                  users:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/User'
                  workspaces:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Workspace'
                  additional_items:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/AdditionalItem'
                  time_entries:
