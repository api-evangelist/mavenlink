      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace:
                  type: object
                  properties:
                    consultant_role_name:
                      type: string
                      description: The label for the consultant team (i.e. the team providing the service).
                    client_role_name:
                      type: string
                      description: The label for the client team (i.e. the team paying for the service).
                    budgeted:
                      type: boolean
                      description: 'Whether the project is budgeted.

                        Defaults to `true` for paid accounts.

                        Defaults to `false` for free accounts.'
                    start_date:
                      type: string
                      format: date
                      description: When the project starts. The date must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
                    due_date:
                      type: string
                      format: date
                      description: When the project is due. The date must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
                    description:
                      type: string
                      description: The description of the project.
                    currency:
                      type: string
                      description: 'The currency of the project.

                        Only applicable if `budgeted` is true.

                        See the [Knowledge Base](https://knowledge.kantata.com/hc/en-us/articles/360041576473) for the list of currency codes.

                        Defaults to the account currency or `USD`.

                        If a `rate_card_id` is provided, this field is ignored.'
                    access_level:
                      type: string
                      description: Whether the project is open, and who can join the project.
                      enum:
                      - invitation
                      - open
                      - admins
                    rate_card_id:
                      type: integer
                      format: int32
                      description: The ID of the rate card for the project. The currency of the rate card must match the currency of the project.
                    exclude_archived_stories_percent_complete:
                      type: boolean
                      description: Whether archived tasks are excluded from the calculation of the project completion percentage.
                    revenue_recognition_method_id:
                      type: string
                      description: 'The criteria that determines how the project''s revenue is recognized and accounted for. The ID is a composite ID made up of a numerical ID (unique to each account), a colon, and the method type. For example `123:percent_complete`. Use the [fetching a list of revenue recognition methods endpoint](/kantata/specification/revenue-recognition-methods/get-revenue-recognition-methods) to get the IDs specific to your account. Set to `null` to remove a workspace''s revenue recognition method.


                        This setting is available only when the [early access feature Revenue Management](https://knowledge.kantata.com/hc/en-us/articles/38986877019803-Revenue-Management-Early-Access) is activated.'
                    revenue_recognition_method_name:
                      type: string
                      description: 'The criteria that determines how the project''s revenue is recognized and accounted for. Default options are `Time & Materials`, `% Complete (Hours)`, and `% Complete (Cost)`. Set to `null` to remove a workspace''s revenue recognition method.


                        This setting is available only when the [early access feature Revenue Management](https://knowledge.kantata.com/hc/en-us/articles/38986877019803-Revenue-Management-Early-Access) is activated.'
                    tasks_default_non_billable:
                      type: boolean
                      description: Whether tasks in the project default to non-billable.
                    stories_are_fixed_fee_by_default:
                      type: boolean
                      description: Whether tasks in the project default to fixed fee (`true`) or time and materials (`false`).
                    expenses_in_burn_rate:
                      type: boolean
                      description: Sets whether both expenses and invoice additional items should be included in the actual fees calculation for the project. Note that setting this field sets the values of both `actual_fees_includes_expenses` and `actual_fees_includes_additional_line_items`. To set the values individually, set `actual_fees_includes_expenses` and `actual_fees_includes_additional_line_items` instead.
                    actual_fees_includes_expenses:
                      type: boolean
                      description: Sets whether expenses should be included in the actual fees calculation for the project.
                    actual_fees_includes_additional_line_items:
                      type: boolean
                      description: Sets whether invoice additional items should be included in the actual fees calculation for the project.
                    posts_require_privacy_decision:
                      type: boolean
                      description: Whether project posts are visible to everyone in the project (`false`) or are private (`true`) by default.
                    status_key:
                      type: integer
                      format: int32
                      description: The status of the project. See the [Knowledge Base](https://knowledge.kantata.com/hc/en-us/articles/115005042433-Project-Status#Project-Status-List) for a list of project status IDs.
                    invoice_preference:
                      type: object
                      description: Invoice customization preferences that will be automatically generated in each invoice for the project.
                      properties:
                        client_invoice_address:
                          type: string
                          description: The client address to automatically generate in each new invoice.
                        client_invoice_name:
                          type: string
                          description: The client name to automatically generate in each new invoice.
                        consultant_invoice_address:
                          type: string
                          description: The provider address to automatically generate in each new invoice.
                        consultant_invoice_name:
                          type: string
                          description: The provider name to automatically generate in each new invoice.
                        project_code:
                          type: string
                          description: The project code to automatically generate in each new invoice.
                        purchase_order:
                          type: string
                          description: The purchase order to automatically generate in each new invoice.
                    approver_id:
                      type: integer
                      format: int32
                      description: The user ID of the designated time approver for the project.
                    workspace_group_ids:
                      type: array
                      items:
                        type: integer
                        format: int32
                      description: The IDs of the [groups](/tag/Workspace-Groups) the project belongs to.
                    project_template_start_date:
                      type: string
                      format: date
                      description: When `project_tracker_template_id` is provided, this sets the start date that tasks will be based on when the template is applied. The date must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
                    project_template_checklist_as_todos:
                      type: boolean
                      description: Whether checklist items are converted to To Dos when applying a template.
                    project_template_assignment_mappings:
                      type: array
                      description: When `project_tracker_template_id` is provided, this maps template resources to named or unnamed resources when the template is applied. If named resources are specified via the `user_id` field, the users should also be included in the `participations` field.
                      items:
                        type: object
                        properties:
                          resource_id:
                            type: integer
                            format: int32
                            description: The ID of the [project template assignment](/tag/Project-Template-Assignments) this mapping is for.
                          user_id:
                            type: integer
                            format: int32
                            description: The ID of the user to map the template resource to. If you pass a `user_id` and do not set `role_id`, the workspace resource's role will be the user's default account role or—if they have none—it will be blank.
                          role_id:
                            type: integer
                            format: int32
                            description: The ID of the account role to use as the workspace role for this template resource. If you pass a `role_id` but do not pass a `user_id`, an unnamed resource will be created.
                    project_template_weekends_as_workdays:
                      type: boolean
                      description: When `project_tracker_template_id` is provided, this sets whether weekends count as work days when applying the template. If `true`, weekend days will be included in task durations.
                    project_template_create_unnamed_resources:
                      type: boolean
                      description: When `project_tracker_template_id` is provided, this maps all template resources and task assignments to unnamed resources, and ignores `project_template_assignment_mappings` for task assignments.
                    project_template_distribute_hours:
                      type: boolean
                      description: When `project_tracker_template_id` is provided, this sets whether task estimated hours in the template are automatically added as scheduled hours for all tasks when applying the template. The hours will be distributed evenly between the task start date and end date.
                    project_tracker_template_id:
                      type: integer
                      format: int32
                      description: The ID of the template to use to populate tasks and other information in the project.
                    primary_workspace_group_id:
                      type: integer
                      format: int32
                      description: The ID of the [group](/tag/Workspace-Groups) that is the primary group for the project.
                    target_margin:
                      type: integer
                      format: int32
                      description: The desired profit, expressed as a percentage.
                    external_reference:
                      type: object
                      description: 'Typically populated programmatically by a third party system via an integration, this is an optional

                        object that holds data from an external system. It connects objects in an external system with objects in

                        Kantata OX (for example, to connect a Jira issue to a Kantata OX Project).'
                      properties:
                        service_name:
                          type: string
                          description: The provider name of the integration. If you are adding multiple external references to the same object, the `service_name` must be unique.
                        service_model:
                          type: string
                          description: The object type of the external object this external reference belongs to.
                        service_model_ref:
                          type: string
                          description: The object ID of the external object this external reference belongs to.
                        status:
                          type: string
                          description: The status of the integration. Options are `successful`, `pending`,  or `failed`.
                        external_message:
                          type: string
                          description: The message on the external object.
                        external_link:
                          type: string
                          description: The link to the external object.
                        external_status:
                          type: string
                          description: The status of the external object in the external system.
                        locked:
                          type: boolean
                          description: Whether the subject is locked.
                      required:
                      - service_name
                      - service_model
                      - service_model_ref
                    account_color_id:
                      type: integer
                      format: int32
                      description: The ID of the [account color](/tag/Account-Colors) to apply to the project.
                    external_link:
                      type: object
                      description: A link to display within the project workspace. Requires the Project Button facilitated feature.
                      properties:
                        text:
                          type: string
                          description: The URL of the link.
                        url:
                          type: string
                          description: The button text.
                    account_insights_mapping_ids:
                      type: array
                      items:
                        type: integer
                        format: int32
                      description: The IDs of Insights dynamic dashboards to add to the project.
                    custom_fields:
                      type: array
                      description: Custom field values for the project.
                      items:
                        type: object
                        properties:
                          custom_field_id:
                            type: integer
                            format: int32
                            description: The ID of the custom field.
                          value:
                            type: string
                            description: 'The value for the corresponding custom field. The value formats for different types are:


                              * `string` - `<text_string>`, eg. `''foo''`

                              * `date` - `<ISO_8601 Date Format>` eg. `''2014-02-25''` `(accepted range: ''1900-01-01'' to ''2015-12-31'')`

                              * `number` - `<integer_value>` eg. `''13''`

                              * `currency` - `[<int_value_in_cents>, <currency_code>]` eg. `''[998, USD]''`

                              * `single` and `multi` - `[<choice_ids>]` eg. `''[1, 2, 4]''`.'
                    stage:
                      type: string
                      description: The stage of the project. Options are `estimate` and `project`.
                      enum:
                      - estimate
                      - project
                    require_notes_on_time_entries:
                      type: boolean
                      description: Whether notes are required on time entries logged against this project.
                    time_trackable:
                      type: boolean
                      description: Sets whether tasks in the project can have time tracked to them. This field is only usable if allowed by [Time & Expense account settings](https://knowledge.kantata.com/hc/en-us/articles/360000317994-Time-Expense-Settings).
                    title:
                      type: string
                    archived:
                      type: boolean
                      description: Set to `true` to archive the project or to `false` to unarchive the project.
                    price:
                      type: integer
                      format: int32
                      description: The project budget, in base units of the currency (e.g. dollars for `USD` ).
                    project_template_before_story_id:
                      type: integer
                      format: int32
                      description: When `project_tracker_template_id` is provided, the template tasks are inserted after the provided task ID. The provided task ID must belong to an existing and top-level task.
                    change_orders_enabled:
                      type: boolean
                      description: Whether approval is required for schedule and budget change orders.
                    task_status_set_id:
                      type: integer
                      format: int32
                      description: The task status set to assign to the workspace. All stories in the workspace must have a default task status—`not started`, `started`, `needs info`, and `completed`—in their `status` field in order to change the task status set.
        required: true
