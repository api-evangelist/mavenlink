                  billing_milestones:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/BillingMilestone'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: Forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: Page Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace:
                  type: object
                  properties:
                    consultant_role_name:
                      type: string
                      description: The label for the consultant team (i.e. the team providing the service).
                    client_role_name:
                      type: string
                      description: The label for the client team (i.e. the team paying for the service).
                    budgeted:
                      type: boolean
                      description: 'Whether the project is budgeted.

                        Defaults to `true` for paid accounts.

                        Defaults to `false` for free accounts.'
                    start_date:
                      type: string
                      format: date
                      description: When the project starts. The date must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
                    due_date:
                      type: string
                      format: date
                      description: When the project is due. The date must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
                    description:
                      type: string
                      description: The description of the project.
                    currency:
                      type: string
                      description: 'The currency of the project.

                        Only applicable if `budgeted` is true.

                        See the [Knowledge Base](https://knowledge.kantata.com/hc/en-us/articles/360041576473) for the list of currency codes.

                        Defaults to the account currency or `USD`.

                        If a `rate_card_id` is provided, this field is ignored.'
                    access_level:
                      type: string
                      description: Whether the project is open, and who can join the project.
                      enum:
                      - invitation
                      - open
                      - admins
                    rate_card_id:
                      type: integer
                      format: int32
                      description: The ID of the rate card for the project. The currency of the rate card must match the currency of the project.
                    exclude_archived_stories_percent_complete:
                      type: boolean
                      description: Whether archived tasks are excluded from the calculation of the project completion percentage.
                    revenue_recognition_method_id:
                      type: string
                      description: 'The criteria that determines how the project''s revenue is recognized and accounted for. The ID is a composite ID made up of a numerical ID (unique to each account), a colon, and the method type. For example `123:percent_complete`. Use the [fetching a list of revenue recognition methods endpoint](/kantata/specification/revenue-recognition-methods/get-revenue-recognition-methods) to get the IDs specific to your account. Set to `null` to remove a workspace''s revenue recognition method.


                        This setting is available only when the [early access feature Revenue Management](https://knowledge.kantata.com/hc/en-us/articles/38986877019803-Revenue-Management-Early-Access) is activated.'
                    revenue_recognition_method_name:
                      type: string
                      description: 'The criteria that determines how the project''s revenue is recognized and accounted for. Default options are `Time & Materials`, `% Complete (Hours)`, and `% Complete (Cost)`. Set to `null` to remove a workspace''s revenue recognition method.


                        This setting is available only when the [early access feature Revenue Management](https://knowledge.kantata.com/hc/en-us/articles/38986877019803-Revenue-Management-Early-Access) is activated.'
                    tasks_default_non_billable:
                      type: boolean
                      description: Whether tasks in the project default to non-billable.
                    stories_are_fixed_fee_by_default:
                      type: boolean
                      description: Whether tasks in the project default to fixed fee (`true`) or time and materials (`false`).
                    expenses_in_burn_rate:
                      type: boolean
                      description: Sets whether both expenses and invoice additional items should be included in the actual fees calculation for the project. Note that setting this field sets the values of both `actual_fees_includes_expenses` and `actual_fees_includes_additional_line_items`. To set the values individually, set `actual_fees_includes_expenses` and `actual_fees_includes_additional_line_items` instead.
                    actual_fees_includes_expenses:
                      type: boolean
                      description: Sets whether expenses should be included in the actual fees calculation for the project.
                    actual_fees_includes_additional_line_items:
                      type: boolean
                      description: Sets whether invoice additional items should be included in the actual fees calculation for the project.
                    posts_require_privacy_decision:
                      type: boolean
                      description: Whether project posts are visible to everyone in the project (`false`) or are private (`true`) by default.
                    status_key:
                      type: integer
                      format: int32
                      description: The status of the project. See the [Knowledge Base](https://knowledge.kantata.com/hc/en-us/articles/115005042433-Project-Status#Project-Status-List) for a list of project status IDs.
                    invoice_preference:
                      type: object
                      description: Invoice customization preferences that will be automatically generated in each invoice for the project.
                      properties:
                        client_invoice_address:
                          type: string
                          description: The client address to automatically generate in each new invoice.
                        client_invoice_name:
                          type: string
                          description: The client name to automatically generate in each new invoice.
                        consultant_invoice_address:
                          type: string
                          description: The provider address to automatically generate in each new invoice.
                        consultant_invoice_name:
                          type: string
                          description: The provider name to automatically generate in each new invoice.
                        project_code:
                          type: string
                          description: The project code to automatically generate in each new invoice.
                        purchase_order:
                          type: string
                          description: The purchase order to automatically generate in each new invoice.
                    approver_id:
                      type: integer
                      format: int32
                      description: The user ID of the designated time approver for the project.
                    workspace_group_ids:
                      type: array
                      items:
                        type: integer
                        format: int32
                      description: The IDs of the [groups](/tag/Workspace-Groups) the project belongs to.
                    project_template_start_date:
                      type: string
                      format: date
                      description: When `project_tracker_template_id` is provided, this sets the start date that tasks will be based on when the template is applied. The date must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
                    project_template_checklist_as_todos:
                      type: boolean
                      description: Whether checklist items are converted to To Dos when applying a template.
                    project_template_assignment_mappings:
                      type: array
                      description: When `project_tracker_template_id` is provided, this maps template resources to named or unnamed resources when the template is applied. If named resources are specified via the `user_id` field, the users should also be included in the `participations` field.
                      items:
                        type: object
                        properties:
                          resource_id:
                            type: integer
                            format: int32
                            description: The ID of the [project template assignment](/tag/Project-Template-Assignments) this mapping is for.
                          user_id:
                            type: integer
                            format: int32
                            description: The ID of the user to map the template resource to. If you pass a `user_id` and do not set `role_id`, the workspace resource's role will be the user's default account role or—if they have none—it will be blank.
                          role_id:
                            type: integer
                            format: int32
                            description: The ID of the account role to use as the workspace role for this template resource. If you pass a `role_id` but do not pass a `user_id`, an unnamed resource will be created.
                    project_template_weekends_as_workdays:
                      type: boolean
                      description: When `project_tracker_template_id` is provided, this sets whether weekends count as work days when applying the template. If `true`, weekend days will be included in task durations.
                    project_template_create_unnamed_resources:
                      type: boolean
                      description: When `project_tracker_template_id` is provided, this maps all template resources and task assignments to unnamed resources, and ignores `project_template_assignment_mappings` for task assignments.
                    project_template_distribute_hours:
                      type: boolean
                      description: When `project_tracker_template_id` is provided, this sets whether task estimated hours in the template are automatically added as scheduled hours for all tasks when applying the template. The hours will be distributed evenly between the task start date and end date.
                    project_tracker_template_id:
                      type: integer
                      format: int32
                      description: The ID of the template to use to populate tasks and other information in the project.
                    primary_workspace_group_id:
                      type: integer
                      format: int32
                      description: The ID of the [group](/tag/Workspace-Groups) that is the primary group for the project.
                    target_margin:
                      type: integer
                      format: int32
                      description: The desired profit, expressed as a percentage.
                    external_reference:
                      type: object
                      description: 'Typically populated programmatically by a third party system via an integration, this is an optional

                        object that holds data from an external system. It connects objects in an external system with objects in

                        Kantata OX (for example, to connect a Jira issue to a Kantata OX Project).'
                      properties:
                        service_name:
                          type: string
                          description: The provider name of the integration. If you are adding multiple external references to the same object, the `service_name` must be unique.
                        service_model:
                          type: string
                          description: The object type of the external object this external reference belongs to.
                        service_model_ref:
                          type: string
                          description: The object ID of the external object this external reference belongs to.
                        status:
                          type: string
                          description: The status of the integration. Options are `successful`, `pending`,  or `failed`.
                        external_message:
                          type: string
                          description: The message on the external object.
                        external_link:
                          type: string
                          description: The link to the external object.
                        external_status:
                          type: string
                          description: The status of the external object in the external system.
                        locked:
                          type: boolean
                          description: Whether the subject is locked.
                      required:
                      - service_name
                      - service_model
                      - service_model_ref
                    account_color_id:
                      type: integer
                      format: int32
                      description: The ID of the [account color](/tag/Account-Colors) to apply to the project.
                    external_link:
                      type: object
                      description: A link to display within the project workspace. Requires the Project Button facilitated feature.
                      properties:
                        text:
                          type: string
                          description: The URL of the link.
                        url:
                          type: string
                          description: The button text.
                    account_insights_mapping_ids:
                      type: array
                      items:
                        type: integer
                        format: int32
                      description: The IDs of Insights dynamic dashboards to add to the project.
                    custom_fields:
                      type: array
                      description: Custom field values for the project.
                      items:
                        type: object
                        properties:
                          custom_field_id:
                            type: integer
                            format: int32
                            description: The ID of the custom field.
                          value:
                            type: string
                            description: 'The value for the corresponding custom field. The value formats for different types are:


                              * `string` - `<text_string>`, eg. `''foo''`

                              * `date` - `<ISO_8601 Date Format>` eg. `''2014-02-25''` `(accepted range: ''1900-01-01'' to ''2015-12-31'')`

                              * `number` - `<integer_value>` eg. `''13''`

                              * `currency` - `[<int_value_in_cents>, <currency_code>]` eg. `''[998, USD]''`

                              * `single` and `multi` - `[<choice_ids>]` eg. `''[1, 2, 4]''`.'
                    stage:
                      type: string
                      description: The stage of the project. Options are `estimate` and `project`.
                      enum:
                      - estimate
                      - project
                    require_notes_on_time_entries:
                      type: boolean
                      description: Whether notes are required on time entries logged against this project.
                    time_trackable:
                      type: boolean
                      description: Sets whether tasks in the project can have time tracked to them. This field is only usable if allowed by [Time & Expense account settings](https://knowledge.kantata.com/hc/en-us/articles/360000317994-Time-Expense-Settings).
                    title:
                      type: string
                    creator_role:
                      type: string
                      description: Which team to add the project creator to. Options are `maven` / `consultant` (i.e. the provider team) and `buyer` / `client` (i.e. the client team). Defaults to `maven`.
                      enum:
                      - client
                      - consultant
                    price:
                      type: integer
                      format: int32
                      description: The starting budget of the project. This is required for budgeted projects.
                    change_orders_enabled:
                      type: boolean
                      description: 'Whether schedule and budget changes require approval.


                        Defaults to `true` if the project is budgeted.'
                    change_orders:
                      type: boolean
                      description: 'Whether schedule and budget changes require approval.


                        Defaults to `true` if the project is budgeted.'
                    organizations:
                      type: array
                      description: The [organizations](/tag/Organizations) to assign to the project.
                      items:
                        type: object
                        properties:
                          department_id:
                            type: integer
                            format: int32
                            description: The ID of the department to assign to the project.
                          geography_id:
                            type: integer
                            format: int32
                            description: The ID of the geographic region to assign to the project.
                    participations:
                      type: array
                      description: Users to add to the project on the provider team.
                      items:
                        type: object
                        properties:
                          user_id:
                            type: integer
                            format: int32
                            description: The user ID of the user to add as a participant on the provider team.
                          access:
                            type: string
                            description: The project permission to assign to the project participant. Legacy options included `collaboration`, `time_logging`, `financial`.
                            enum:
                            - edit_tasks
                            - view_tasks
                            - edit_time_and_expenses
                            - view_time_and_expenses
                            - edit_financials
                            - view_financials
                            - admin
                    primary_maven_id:
                      type: integer
                      format: int32
                      description: 'The ID of the user to set as the team lead on the provider team.


                        Note: To change the provider team lead after the project has been created, use the [update participation endpoint](/tag/Participations#operation/update-participation).'
                    require_expense_approvals:
                      type: boolean
                      description: Whether expenses logged to the project must be approved.
                    require_time_approvals:
                      type: boolean
                      description: Whether time tracked to the project must be approved.
                    estimate_scenario_id:
                      type: integer
                      format: int32
                      description: The ID of the estimate scenario to create this project from. Must also provide a `start_date`.
                    attachment_ids:
                      type: array
                      items:
                        type: integer
                        format: int32
                      description: The IDs of file attachments to associate with the project after it is created.
                    task_status_set_id:
                      type: integer
                      format: int32
                      description: The task status set to assign to the workspace.
                  required:
                  - title
        required: true
  /workspaces/{id}:
    get:
      summary: Fetching a single Workspace
      description: 'Gets a project by ID.


        By default, you will receive a 404 status if you try to retrieve an archived project. Use the `include_archived:true`

        filter to retrieve an archived project.


        Users with Project Lead (or lower) account permissions can retrieve projects they are not participating in if they have

        the `All projects` or `All projects accessible to their organization` (if Organizations are enabled) permission in the

        `View Resource Center` section of the `Resource Management` Access Group set.



        This endpoint returns structured Workspace objects.

        As with all Kantata OX API endpoints, the returned data will be referenced in sorted order in the `results` array

        and will be indexed by ID in the `workspaces` top-level JSON key.

        Please see our [Response Format](#section/Response-Format) section for more information.'
      operationId: Get Workspace
      tags:
      - Workspaces
      parameters:
      - in: path
        name: id
        required: true
        description: The ID of the Model.
        schema:
          type: integer
      - in: query
        name: include
        description: 'Any of the below associations can be included in your request by providing the `include` param, e.g. `include=association1,association2`.

          - `account_color` (AccountColor) - Retrieves the color of the workspace. The response will include `account_color_id`, which references the data in the `account_colors` top-level key.

          - `account_insights_mappings` (AccountInsightsMapping) - Retrieves the Insights dynamic dashboards in the workspace. The response will include `account_insights_mapping_ids`, which references the data in the `account_insights_mappings` top-level key.

          - `approver` (User) - Retrieves the first approver (as determined by user ID) on the workspace who is viewable to the current user. The response will include `approver_id`, which references the data in the `users` top-level key.

          - `approvers` (User) - Retrieves all time approvers on the workspace who are viewable to the current user. The response will include `approver_ids`, which references the data in the `users` top-level key.

          - `billing_milestones` (BillingMilestone) - Retrieves the billing milestones for the workspace. The response will include `billing_milestone_ids`, which references the data in the `billing_milestones` top-level key.

          - `creator` (User) - Retrieves the user who created the project. The response will include `creator_id`, which references the data in the `users` top-level key. If the creator has left the project, you can use `primary_counterpart` to get the provider-side team lead.

          - `current_status_report` (StatusReport) - Retrieves the most recent project status report from today. The response will include `current_status_report_id`, which references the data in the `status_reports` top-level key.

          - `current_user_participation` (Participation) - Retrieves the workspace participation of the current user. The response will include `current_user_participation_ids`, which references the data in the `participations` top-level key.

          - `custom_field_values` (CustomFieldValue) - Retrieves custom field values for the workspace. The response will include `custom_field_value_ids`, which references the data in the `custom_field_values` top-level key.

          - `external_references` (ExternalReference) - Includes references to external integrations for this object.

          - `financial_viewers` (User) - Retrieves the users on the project who have financial access. The response will include `financial_viewer_ids`, which references the data in the `users` top-level key.

          - `next_uncompleted_milestone` (Story) - Retrieves the next project milestone that is not complete. The response will include `next_uncompleted_milestone_id`, which references the data in the `stories` top-level key.

          - `participants` (User) - Retrieves users that are participating in the project. The response will include `participant_ids`, which references the data in the `users` top-level key.

          - `participations` (Participation) - Retrieves the [participations](/tag/Participations) of each participant in the project. The response will include `participation_ids`, which references the data in the `participations` top-level key.

          - `possible_approvers` (User) - Retrieves the users that can be made time approvers on the workspace. The response will include `possible_approver_ids`, which references the data in the `users` top-level key.

          - `primary_counterpart` (User) - Retrieves the lead of the Clients team. The response will include `primary_counterpart_id`, which references the data in the `users` top-level key.

          - `primary_maven` (User) - Retrieves the lead of the Providers team. The response will include `primary_maven_id`, which references the data in the `users` top-level key.

          - `primary_workspace_group` (WorkspaceGroup) - Retrieves the primary group associated with the project. The response will include `primary_workspace_group_id`, which references the data in the `workspace_groups` top-level key.

          - `status_reports` (StatusReport) - Retrieves the status reports for the workspace. The response will include `status_report_ids`, which references the data in the `status_reports` top-level key.

          - `timesheet_submissions` (TimesheetSubmission) - Retrieves the list of all submitted timesheets which the user can approve on the project. The response will include `timesheet_submission_ids`, which references the data in the `timesheet_submissions` top-level key.

          - `workspace_groups` (WorkspaceGroup) - Retrieves groups associated with the project that is visible to the current user. The response will include `workspace_group_ids`, which references the data in the `workspace_groups` top-level key.

          - `workspace_resources` (WorkspaceResource) - Retrieves the named resources for the workspace. The response will include `workspace_resource_ids`, which references the data in the `workspace_resources` top-level key.

          - `workspace_resources_with_unnamed` (WorkspaceResource) - Retrieves the named and unnamed resources for the workspace. The response will include `workspace_resources_with_unnamed_ids`, which references the data in the `workspace_resources` top-level key.'
        schema:
          type: string
      - in: query
        name: optional_fields
        description: Allows you to request one or more optional fields as an array.
        schema:
          type: array
          items:
            type: string
            enum:
            - revenue_recognition_method_id
            - revenue_recognition_method_name
            - client_lead_name
            - provider_lead_name
            - stage
            - estimated_minutes
            - total_invoiced
            - total_minutes_approved
            - billable_minutes
            - non_billable_minutes
            - minutes_logged
            - incoming_email_address
            - lock_date
      responses:
        '200':
          description: The Workspace has been retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int32
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        format: int32
                      page_count:
                        type: integer
                        format: int32
                      page_number:
                        type: integer
                        format: int32
                      page_size:
                        type: integer
                        format: int32
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        id:
                          type: string
                  workspaces:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Workspace'
                  external_references:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/ExternalReference'
                  stories:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Story'
                  users:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/User'
                  participations:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Participation'
                  timesheet_submissions:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/TimesheetSubmission'
                  workspace_groups:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/WorkspaceGroup'
                  custom_field_values:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/CustomFieldValue'
                  workspace_resources:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/WorkspaceResource'
                  status_reports:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/StatusReport'
                  account_colors:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/AccountColor'
                  account_insights_mappings:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/AccountInsightsMapping'
                  billing_milestones:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/BillingMilestone'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: Forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: Page Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    put:
      summary: Updating an existing Workspace
      description: 'This endpoint returns structured Workspace objects.

        As with all Kantata OX API endpoints, the returned data will be referenced in sorted order in the `results` array

        and will be indexed by ID in the `workspaces` top-level JSON key.

        Please see our [Response Format](#section/Response-Format) section for more information.'
      operationId: Update Workspace
      tags:
      - Workspaces
      parameters:
      - in: path
        name: id
        required: true
        description: The ID of the Model.
        schema:
          type: integer
      - in: query
        name: include
        description: 'Any of the below associations can be included in your request by providing the `include` param, e.g. `include=association1,association2`.

          - `account_color` (AccountColor) - Retrieves the color of the workspace. The response will include `account_color_id`, which references the data in the `account_colors` top-level key.

          - `account_insights_mappings` (AccountInsightsMapping) - Retrieves the Insights dynamic dashboards in the workspace. The response will include `account_insights_mapping_ids`, which references the data in the `account_insights_mappings` top-level key.

          - `approver` (User) - Retrieves the first approver (as determined by user ID) on the workspace who is viewable to the current user. The response will include `approver_id`, which references the data in the `users` top-level key.

          - `approvers` (User) - Retrieves all time approvers on the workspace who are viewable to the current user. The response will include `approver_ids`, which references the data in the `users` top-level key.

          - `billing_milestones` (BillingMilestone) - Retrieves the billing milestones for the workspace. The response will include `billing_milestone_ids`, which references the data in the `billing_milestones` top-level key.

          - `creator` (User) - Retrieves the user who created the project. The response will include `creator_id`, which references the data in the `users` top-level key. If the creator has left the project, you can use `primary_counterpart` to get the provider-side team lead.

          - `current_status_report` (StatusReport) - Retrieves the most recent project status report from today. The response will include `current_status_report_id`, which references the data in the `status_reports` top-level key.

          - `current_user_participation` (Participation) - Retrieves the workspace participation of the current user. The response will include `current_user_participation_ids`, which references the data in the `participations` top-level key.

          - `custom_field_values` (CustomFieldValue) - Retrieves custom field values for the workspace. The response will include `custom_field_value_ids`, which references the data in the `custom_field_values` top-level key.

          - `external_references` (ExternalReference) - Includes references to external integrations for this object.

          - `financial_viewers` (User) - Retrieves the users on the project who have financial access. The response will include `financial_viewer_ids`, which references the data in the `users` top-level key.

          - `next_uncompleted_milestone` (Story) - Retrieves the next project milestone that is not complete. The response will include `next_uncompleted_milestone_id`, which references the data in the `stories` top-level key.

          - `participants` (User) - Retrieves users that are participating in the project. The response will include `participant_ids`, which references the data in the `users` top-level key.

          - `participations` (Participation) - Retrieves the [participations](/tag/Participations) of each participant in the project. The response will include `participation_ids`, which references the data in the `participations` top-level key.

          - `possible_approvers` (User) - Retrieves the users that can be made time approvers on the workspace. The response will include `possible_approver_ids`, which references the data in the `users` top-level key.

          - `primary_counterpart` (User) - Retrieves the lead of the Clients team. The response will include `primary_counterpart_id`, which references the data in the `users` top-level key.

          - `primary_maven` (User) - Retrieves the lead of the Providers team. The response will include `primary_maven_id`, which references the data in the `users` top-level key.

          - `primary_workspace_group` (WorkspaceGroup) - Retrieves the primary group associated with the project. The response will include `primary_workspace_group_id`, which references the data in the `workspace_groups` top-level key.

          - `status_reports` (StatusReport) - Retrieves the status reports for the workspace. The response will include `status_report_ids`, which references the data in the `status_reports` top-level key.

          - `timesheet_submissions` (TimesheetSubmission) - Retrieves the list of all submitted timesheets which the user can approve on the project. The response will include `timesheet_submission_ids`, which references the data in the `timesheet_submissions` top-level key.

          - `workspace_groups` (WorkspaceGroup) - Retrieves groups associated with the project that is visible to the current user. The response will include `workspace_group_ids`, which references the data in the `workspace_groups` top-level key.

          - `workspace_resources` (WorkspaceResource) - Retrieves the named resources for the workspace. The response will include `workspace_resource_ids`, which references the data in the `workspace_resources` top-level key.

          - `workspace_resources_with_unnamed` (WorkspaceResource) - Retrieves the named and unnamed resources for the workspace. The response will include `workspace_resources_with_unnamed_ids`, which references the data in the `workspace_resources` top-level key.'
        schema:
          type: string
      - in: query
