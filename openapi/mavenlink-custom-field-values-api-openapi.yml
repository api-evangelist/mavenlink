    post:
      summary: Creating a new Custom Field Value
      description: "Creates a new value for the specified custom field. Creating a value can also override existing values,\neffectively making this an update request as well.\n\nWhen creating new [single or multi choice values](/tag/Custom-Field-Choices) that\noverride existing values, note that new values are not _added_ to existing values, but instead _replace_ existing values.\nAdditionally, every new value has a unique, new ID.\n\nThis endpoint has its own rate limit. See the [Knowledge Base](https://knowledge.kantata.com/hc/en-us/articles/9698066628123) for more information.\n\n**Bulk Create or Update**\n\nThis endpoint supports bulk creating or updating up to 100 objects. In the request body, set the top-level key to its plural form and place the objects in an array. Example:\n\n```\n{\n  \"custom_field_values\": [\n    {\n      \"subject_type\": \"Workspace\",\n      \"subject_id\": 123,\n      \"custom_field_id\": 456,\n      \"value\": \"Hello world\"\n    },\n    {\n      \"subject_type\": \"Workspace\",\n      \"subject_id\": 123,\n      \"custom_field_id\": 789,\n      \"value\": \"Hello world\"\n    }\n  ]\n}\n```\n\n\nThis endpoint returns structured Custom Field Value objects.\nAs with all Kantata OX API endpoints, the returned data will be referenced in sorted order in the `results` array\nand will be indexed by ID in the `custom_field_values` top-level JSON key.\nPlease see our [Response Format](#section/Response-Format) section for more information."
      operationId: Create Custom Field Value
      tags:
      - Custom Field Values
      parameters:
      - in: query
        name: include
        description: 'Any of the below associations can be included in your request by providing the `include` param, e.g. `include=association1,association2`.

          - `custom_field` (CustomField) - Retrieves the custom field the value is for. The response will include `custom_field_id`, which references the data in the `custom_fields` top-level key.

          - `external_references` (ExternalReference) - Includes references to external integrations for this object.

          - `selected_choices` (CustomFieldChoice) - Retrieves the custom field choice that corresponds to the custom field value. The response will include `selected_choice_ids`, which references the data in the `custom_field_choices` top-level key.

          - `setter` (User) - Retrieves the user that set the custom field value. The response will include `setter_id`, which references the data in the `users` top-level key.

          - `subject` (polymorphic) - Retrieves the object which the custom field value is for. The response will include `subject_ref`, which references the data in the top-level key specified in the `key` field of `subject_ref`. The possible objects are as follows:

          * `Estimate`

          * `Workspace` (Project)

          * `WorkspaceGroup` (Group)

          * `Resource`

          * `Story` (Task)

          * `User`.'
        schema:
          type: string
      responses:
        '200':
          description: Custom Field Value has been created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int32
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        format: int32
                      page_count:
                        type: integer
                        format: int32
                      page_number:
                        type: integer
                        format: int32
                      page_size:
                        type: integer
                        format: int32
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        id:
                          type: string
                  custom_field_values:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/CustomFieldValue'
                  external_references:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/ExternalReference'
                  custom_fields:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/CustomField'
                  users:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/User'
                  custom_field_choices:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/CustomFieldChoice'
                  stories:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Story'
                  workspaces:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Workspace'
                  workspace_groups:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/WorkspaceGroup'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: Forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: Page Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                custom_field_value:
                  type: object
                  properties:
                    subject_type:
                      type: string
                      description: 'You must specify which set of Custom Fields to return values for:

                        * `Estimate`

                        * `Story` (Task)

                        * `User`

                        * `Workspace` (Project)

                        * `WorkspaceGroup` (Group)

                        * `Resource`


                        This parameter is required.'
                    subject_id:
                      type: integer
                      format: int32
                      description: The ID of the Estimate, Project, Group, Resource, Task, or User the custom field is for.
                    custom_field_id:
                      type: integer
                      format: int32
                      description: The ID of the Custom Field to create or update the value for.
                    value:
                      type: string
                      description: 'The value to create or update to for the specified custom field.


                        Values can be created or updated in these formats:


                        | Value Type           | Format                                   | Sample         |

                        | -------------------- |:----------------------------------------:| --------------:|

                        | `string`             | `<text_string>`                          |        `"foo"` |

                        | `date`               | `<ISO_8601 Date Format>`                 | `"2014-02-25"` |

                        | `number`             | `<integer_value>`                        |           `13` |

                        | `currency`           | `[<int_value_in_cents>, <currency_code>]`| `[998, "USD"]` |

                        | `single` and `multi` | `[<choice_ids>]`                         |    `[1, 2, 4]` |


                        ##### Note:

                        The `write_access` [permission setting on each custom field](https://mavenlink.zendesk.com/hc/en-us/articles/202924760#see)

                        determines the minimum permission needed to edit the value of each custom field.

                        * Editing `Workspace` (Project), `Resource`, and `Story` (Task) custom fields are project-specific changes,

                        so permissions are set at the project level:

                        - `project_collaboration`

                        - `time_logging`

                        - `financial`

                        - `project_admin` (default)


                        Most account-level permissions supercede project-level permissions. Therefore, Account Administrators

                        are able to edit all Project, Resource, and Task custom fields and values across the account,

                        regardless of project participation or `write_access` settings.

                        * Editing `Estimate`, `WorkspaceGroup` (Group), and `User` custom fields are account-wide changes,

                        so permissions are set at the account level:

                        - `account_collaboration`

                        - `project_creator`

                        - `project_lead`

                        - `reports_viewer`

                        - `reports_viewer_with_cost`

                        - `account_admin` (default).'
                  required:
                  - subject_type
                  - subject_id
                  - custom_field_id
                  - value
        required: true
    delete:
