      - Workspace Allocations
      parameters:
      - in: query
        name: split_date
        required: true
        description: The date on which the allocation splits, in YYYY-MM-DD format. The date must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
        schema:
          type: string
          format: date
      - in: query
        name: workspace_allocation_id
        required: true
        description: The ID of the allocation. This can be found via the [Fetch Workspace Allocations endpoint](/tag/Workspace-Allocations#operation/get-workspace-allocations).
