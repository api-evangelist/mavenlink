              schema:
                $ref: '#/components/schemas/Errors'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                story:
                  type: object
                  properties:
                    workspace_id:
                      type: integer
                      format: int32
                      description: The workspace ID where this story should be created.
                    title:
                      type: string
                    story_type:
                      type: string
                      description: 'Must be one of: ''task'', ''deliverable'', ''milestone'', or ''issue''. Defaults to: ''task''.'
                      enum:
                      - task
                      - deliverable
                      - milestone
                      - issue
                    description:
                      type: string
                      description: Must be less than 1000 characters.
                    start_date:
                      type: string
                      format: date
                      description: Projected start date of the project. Format should look like YYYY-MM-DD. The date must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
                    due_date:
                      type: string
                      format: date
                      description: Projected end date of the project. Format should look like YYYY-MM-DD. The date must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
                    state:
                      type: string
                      description: "The status type (category). It is recommended to set the `status` field instead (which supports custom task statuses).\n\nPossible options depend on the `story_type`:\n  - Possible options for `task`, `deliverable`, and `milestone` are `not started`, `started`, `needs info`, and `completed`.\n  - If a task status set has not been applied to the workspace, possible options for `issue` are `new`, `reopened`, `in progress`, `blocked`, `fixed`, `duplicate`, `can't repro`, `resolved`, and `won't fix`.\n    Otherwise, possible options are `not started`, `started`, `needs info`, and `completed`.\n\nIf both `status` and `state` are provided, the provided `state` value is ignored and the corresponding `category` of the provided `status` is applied to the `state` field instead."
                      enum:
                      - not started
                      - started
                      - needs info
                      - completed
                      - new
                      - reopened
                      - in progress
                      - blocked
                      - fixed
                      - duplicate
                      - can't repro
                      - resolved
                      - won't fix
                    status:
                      type: string
                      description: "The status of the story. Possible options depend on whether the workspace has an assigned task status set.\n  - If the workspace does not have a task status set assigned, possible options are `not started`, `started`, `needs info`, and `completed`.\n  - If the workspace has a task status set assigned, the possible options are the statuses within the task status set.\n    You can get a list of statuses within the project’s task status set using the Task Status Set endpoint.\n\nWhen `status` is updated, its `category` is automatically applied to the `state` field of the story."
                    checklist:
                      type: array
                      items:
                        type: string
                      description: An array of checklist items.
                    parent_id:
                      type: integer
                      format: int32
                      description: Represents the parent of this story, making this a substory.
                    archived:
                      type: boolean
                      description: Boolean representing whether or not this story is archived.
                    assignee_ids:
                      type: array
                      items:
                        type: integer
                        format: int32
                      description: An array of user IDs.
                    budget_estimate_in_cents:
                      type: integer
                      format: int32
                      description: Can only be set if the workspace is budgeted and the user has budget permissions.
                    time_estimate_in_minutes:
                      type: integer
                      format: int32
                      description: Can only be set if the workspace is budgeted and the user has budget permissions.
                    tag_list:
                      type: string
                      description: A comma separated.
                    percentage_complete:
                      type: integer
                      format: int32
                      description: Between 0 and 100. Setting above 0 starts the story and setting to 100 completes the story..
                    fixed_fee:
                      type: boolean
                      description: Representing whether the story is fixed fee or not. Can only be set if the workspace is budgeted and the user has budget permissions.
                    billable:
                      type: boolean
                      description: Representing whether the story is billable or not. Can only be set if the workspace is budgeted and the user has budget permissions.
                    weight:
                      type: integer
                      format: int32
                      description: Representing the weight of the story. Can only be set on a parent-level milestone by a consultant with at least budget permissions.
                    priority:
                      type: string
                      description: The current priority (importance) of the story (low, normal, high, critical). The default is normal..
                      enum:
                      - low
                      - normal
                      - high
                      - critical
                    time_trackable:
                      type: boolean
                      description: 'Whether the story can have time logged against it. Whether this field can be updated and by whom depends on the selections in

                        [Time & Expense Settings](https://knowledge.kantata.com/hc/en-us/articles/360000317994-Time-Expense-Settings).

                        Time & Expense Settings also determine the default value for new tasks. An Account Administrator can explicitly set this field and override the default for new tasks.'
                    external_reference:
                      type: object
                      description: 'Typically populated programmatically by a third party system via an integration, this is an optional

                        object that holds data from an external system. It connects objects in an external system with objects in

                        Kantata OX (for example, to connect a Jira issue to a Kantata OX Project).'
                      properties:
                        service_name:
                          type: string
                          description: The provider name of the integration. If you are adding multiple external references to the same object, the `service_name` must be unique.
                        service_model:
                          type: string
                          description: The object type of the external object this external reference belongs to.
                        service_model_ref:
                          type: string
                          description: The object ID of the external object this external reference belongs to.
                        status:
                          type: string
                          description: The status of the integration. Options are `successful`, `pending`,  or `failed`.
                        external_message:
                          type: string
                          description: The message on the external object.
                        external_link:
                          type: string
                          description: The link to the external object.
                        external_status:
                          type: string
                          description: The status of the external object in the external system.
                        locked:
                          type: boolean
                          description: Whether the subject is locked.
                      required:
                      - service_name
                      - service_model
                      - service_model_ref
                    custom_fields:
                      type: array
                      description: Determines the custom field values for the task.
                      items:
                        type: object
                        properties:
                          custom_field_id:
                            type: integer
                            format: int32
                            description: The ID of the custom field.
                          value:
                            type: string
                            description: 'The value for the corresponding custom field. The value formats for different types are:


                              * `string` - `<text_string>`, eg. `''foo''`

                              * `date` - `<ISO_8601 Date Format>` eg. `''2014-02-25''` `(accepted range: ''1900-01-01'' to ''2015-12-31'')`

                              * `number` - `<integer_value>` eg. `''13''`

                              * `currency` - `[<int_value_in_cents>, <currency_code>]` eg. `''[998, USD]''`

                              * `single` and `multi` - `[<choice_ids>]` eg. `''[1, 2, 4]''`.'
                    attachment_ids:
                      type: array
                      items:
                        type: integer
                        format: int32
                      description: The attachment ids for the files to be associated with the project after its created.
                    project_plan:
                      type: boolean
                      description: Whether the story is a project task (`true`) or is a To Do (`false`).
                  required:
                  - workspace_id
                  - title
        required: true
  /stories/{id}:
    get:
      summary: Fetching a single Story
      description: 'This endpoint returns structured Story objects.

        As with all Kantata OX API endpoints, the returned data will be referenced in sorted order in the `results` array

        and will be indexed by ID in the `stories` top-level JSON key.

        Please see our [Response Format](#section/Response-Format) section for more information.'
      operationId: Get Story
      tags:
      - Stories
      parameters:
      - in: path
        name: id
        required: true
        description: The ID of the Model.
        schema:
          type: integer
      - in: query
        name: include
        description: 'Any of the below associations can be included in your request by providing the `include` param, e.g. `include=association1,association2`.

          - `ancestors` (Story) - Retrieves all of the tasks that the task is nested under (parents and top-level tasks). The response will include `ancestor_ids`, which references the data in the `stories` top-level key.

          - `assigned_role` (Role) - Retrieves the authenticated user’s assigned role for the task. The response will include `assigned_role_id`, which references the data in the `roles` top-level key.

          - `assignees` (User) - Retrieves all users assigned to the task, excluding unnamed resources. The response will include `assignee_ids`, which references the data in the `users` top-level key.

          - `attachments` (Attachments::PostAttachment) - Retrieves all attachments in the task''s posts. The response will include `attachment_ids`, which references the data in the `attachments` top-level key.  Must be used with the `only` parameter.

          - `creator` (User) - Retrieves the user who created the task. The response will include `creator_id`, which references the data in the `users` top-level key.

          - `current_assignments` (Assignment) - Retrieves all assignments for the task. The response will include `current_assignment_ids`, which references the data in the `assignments` top-level key.

          - `custom_field_values` (CustomFieldValue) - Retrieves the task’s custom field values. The response will include `custom_field_value_ids`, which references the data in the `custom_field_values` top-level key.

          - `descendants` (Story) - Retrieves all of the subtasks nested under this top-level task. The response will include `descendant_ids`, which references the data in the `stories` top-level key.

          - `external_references` (ExternalReference) - Includes references to external integrations for this object.

          - `followers` (User) - Retrieves all users following the task. The response will include `follower_ids`, which references the data in the `users` top-level key.

          - `google_documents` (GoogleDocument) - Retrieves all Google documents for the task. The response will include `google_document_ids`, which references the data in the `google_documents` top-level key.  Must be used with the `only` parameter.

          - `parent` (Story) - Retrieves the parent task that this subtask is nested directly under. The response will include `parent_id`, which references the data in the `stories` top-level key.

          - `potential_workspace_resources` (WorkspaceResource) - Retrieves the project''s named resources who are not assigned to the task. The response will include `potential_workspace_resource_ids`, which references the data in the `workspace_resources` top-level key.  Must be used with the `only` parameter.

          - `potential_workspace_resources_with_unnamed` (WorkspaceResource) - Retrieves all of the project''s resources (named and unnamed) who are not assigned to the task. The response will include `potential_workspace_resources_with_unnamed_ids`, which references the data in the `workspace_resources` top-level key.  Must be used with the `only` parameter.

          - `replies` (Post) - Retrieves all task posts, except for the first one. The response will include `reply_ids`, which references the data in the `posts` top-level key.  Must be used with the `only` parameter.

          - `root` (Story) - Retrieves the top-level task that this subtask is nested under. The response will include `root_id`, which references the data in the `stories` top-level key.

          - `source_dependencies` (StoryDependency) - Retrieves all tasks that this task is dependent on. The response will include `source_dependency_ids`, which references the data in the `story_dependencies` top-level key.

          - `story_state_changes` (StoryStateChange) - Retrieves all status changes the task has gone through. The response will include `story_state_change_ids`, which references the data in the `story_state_changes` top-level key.  Must be used with the `only` parameter.

          - `story_tasks` (StoryTask) - Retrieves all checklist items for the task. The response will include `story_task_ids`, which references the data in the `story_tasks` top-level key.

          - `sub_stories` (Story) - Retrieves all direct subtasks of the task. This does not include the subtasks of its direct subtasks. The response will include `sub_story_ids`, which references the data in the `stories` top-level key.

          - `tags` (ActsAsTaggableOn::Tag) - Retrieves all tags for the task. The response will include `tag_ids`, which references the data in the `tags` top-level key.

          - `target_dependencies` (StoryDependency) - Retrieves all tasks that are dependent on this task. The response will include `target_dependency_ids`, which references the data in the `story_dependencies` top-level key.

          - `workspace` (Workspace) - Retrieves the project the task is in. The response will include `workspace_id`, which references the data in the `workspaces` top-level key.

          - `workspace_resources` (WorkspaceResource) - Retrieves the named resources who are assigned to the task. The response will include `workspace_resource_ids`, which references the data in the `workspace_resources` top-level key.

          - `workspace_resources_with_unnamed` (WorkspaceResource) - Retrieves all of the resources (named and unnamed) assigned to the task. The response will include `workspace_resources_with_unnamed_ids`, which references the data in the `workspace_resources` top-level key.'
        schema:
          type: string
      - in: query
        name: optional_fields
        description: Allows you to request one or more optional fields as an array.
        schema:
          type: array
          items:
            type: string
            enum:
            - custom_task_status_id
            - read_only
            - can_edit
            - can_post
            - archived_editable
            - is_time_trackable_type
            - has_out_of_bounds_sads
            - can_align_time
            - formatted_description
            - parsed_description
            - render_description_markdown
      - in: query
        name: show_deleted
        required: false
        description: Returns a deleted story when set to true.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The Story has been retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int32
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        format: int32
                      page_count:
                        type: integer
                        format: int32
                      page_number:
                        type: integer
                        format: int32
                      page_size:
                        type: integer
                        format: int32
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        id:
                          type: string
                  stories:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Story'
                  external_references:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/ExternalReference'
                  workspace_resources:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/WorkspaceResource'
                  workspaces:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Workspace'
                  users:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/User'
                  assignments:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Assignment'
                  story_tasks:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/StoryTask'
                  tags:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/ActsAsTaggableOn__Tag'
                  story_state_changes:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/StoryStateChange'
                  posts:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Post'
                  attachments:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Attachments__PostAttachment'
                  story_dependencies:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/StoryDependency'
                  custom_field_values:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/CustomFieldValue'
                  roles:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Role'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
