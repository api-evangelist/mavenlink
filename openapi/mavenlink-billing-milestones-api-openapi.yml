    delete:
      summary: Deleting an existing Billing Milestones
      description: 'Delete a billing milestone in your Billing Schedule. You can only delete billing milestones that have not been invoiced.


        The response will contain no content and an HTTP 204 status code if the request was

        successful, or a standard Kantata OX error message explaining why the object could not be deleted.'
      operationId: Delete Billing Milestone
      tags:
