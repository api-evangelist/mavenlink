          - `invoices` (Invoice) - Retrieves the invoices that the billing milestones are on. The response will include `invoice_ids`, which references the data in the `invoices` top-level key.

          - `story` (Story) - Retrieves the task associated with the billing milestone. The response will include `story_id`, which references the data in the `stories` top-level key.

          - `workspace` (Workspace) - Retrieves the project that the billing milestone is in. The response will include `workspace_id`, which references the data in the `workspaces` top-level key.'
        schema:
          type: string
      responses:
        '200':
          description: The Billing Milestones has been retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int32
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        format: int32
                      page_count:
                        type: integer
                        format: int32
                      page_number:
                        type: integer
                        format: int32
                      page_size:
                        type: integer
                        format: int32
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        id:
                          type: string
                  billing_milestones:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/BillingMilestone'
                  external_references:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/ExternalReference'
                  workspaces:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Workspace'
                  stories:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Story'
                  invoices:
                    type: object
