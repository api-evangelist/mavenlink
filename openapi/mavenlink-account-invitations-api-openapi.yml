    altText: Kantata OX API Documentation
    href: https://developer.kantata.com
servers:
- url: https://api.mavenlink.com/api/v1
tags:
- name: Account Invitations
  description: Account Invitations represent invitations for non-users to join a Kantata OX account.
paths:
  /account_invitations:
    get:
      summary: Fetching a list of Account Invitations
      description: 'This endpoint returns structured Account Invitation objects.

        As with all Kantata OX API endpoints, the returned data will be referenced in sorted order in the `results` array

        and will be indexed by ID in the `account_invitations` top-level JSON key.

        Please see our [Response Format](#section/Response-Format) section for more information.'
      operationId: Get Account Invitations
      tags:
      - Account Invitations
      parameters:
      - in: query
        name: by_full_name
        description: Show entries where the full name is like the specified parameter.
        schema:
          type: string
      - in: query
        name: include
        description: 'Any of the below associations can be included in your request by providing the `include` param, e.g. `include=association1,association2`.

          - `default_role` (Role) - The default role of the account.

          - `invitee` (User) - The new user who will receive the invitation.

          - `inviter` (User) - The user who has sent the invitation.'
        schema:
          type: string
      - in: query
        name: only
        description: 'Allows you to request one or more resources directly by ID. Multiple IDs can be supplied

          in a comma separated list, like `GET /api/v1/workspaces.json?only=5,6,7`.'
        schema:
          type: string
      - in: query
        name: only_pending
        description: Show only pending invitations.
        schema:
          type: boolean
          default: true
      - in: query
        name: order
        description: 'Supply `order` with the name of a valid sort field for the endpoint and a direction.


          Valid values: `bill_rate:asc`, `bill_rate:desc`, `cost_rate:asc`, `cost_rate:desc`, `created_at:asc`, `created_at:desc`, `expiration_date:asc`, `expiration_date:desc`, `full_name:asc`, `full_name:desc`, `permission:asc`, and `permission:desc`.'
        schema:
          type: string
          default: created_at:desc
      - in: query
        name: page
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 200
      - in: query
        name: search
        schema:
          type: string
      responses:
        '200':
          description: A list of Account Invitations have been retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int32
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        format: int32
                      page_count:
                        type: integer
                        format: int32
                      page_number:
                        type: integer
                        format: int32
                      page_size:
                        type: integer
                        format: int32
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        id:
                          type: string
                  account_invitations:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/AccountInvitation'
                  users:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/User'
                  roles:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Role'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: Forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: Page Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    post:
      summary: Creating a new Account Invitation
      description: "Adds a user to your account.\n\nAny members added in excess of your contracted license count are billed at a prorated subscription fee for\nthe remainder of the billing term. To review your contracted license count,\nin Kantata OX, hover over Settings in the left navigation and select Plan.\n\nThis endpoint has its own rate limit. See the [Knowledge Base](https://knowledge.kantata.com/hc/en-us/articles/9698066628123) for more information.\n\n**Bulk Create**\n\nThis endpoint supports bulk creating up to 50 objects. In the request body, set the top-level key to its plural\nform and place the objects in an array. Example:\n\n```\n{\n  \"account_invitations\": [\n    {\n      \"email_address\": \"email@email.com\",\n      \"full_name\": \"Full Name\"\n    },\n    {\n      \"email_address\": \"email@email.com\",\n      \"full_name\": \"Full Name\"\n    }\n  ]\n}\n```\n\n\nThis endpoint returns structured Account Invitation objects.\nAs with all Kantata OX API endpoints, the returned data will be referenced in sorted order in the `results` array\nand will be indexed by ID in the `account_invitations` top-level JSON key.\nPlease see our [Response Format](#section/Response-Format) section for more information."
      operationId: Create Account Invitation
      tags:
      - Account Invitations
      parameters:
      - in: query
        name: include
        description: 'Any of the below associations can be included in your request by providing the `include` param, e.g. `include=association1,association2`.

          - `default_role` (Role) - The default role of the account.

          - `invitee` (User) - The new user who will receive the invitation.

          - `inviter` (User) - The user who has sent the invitation.'
        schema:
          type: string
      responses:
        '200':
          description: Account Invitation has been created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int32
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        format: int32
                      page_count:
                        type: integer
                        format: int32
                      page_number:
                        type: integer
                        format: int32
                      page_size:
                        type: integer
                        format: int32
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        id:
                          type: string
                  account_invitations:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/AccountInvitation'
                  users:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/User'
                  roles:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Role'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: Forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: Page Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account_invitation:
                  type: object
                  properties:
                    billability_target:
                      type: integer
                      format: int32
                    bill_rate_in_cents:
                      type: integer
                      format: int32
                      description: 'The default billing rate, in cents, for the user in a workspace on this account (when the workspace

                        does not use a rate card). This attribute can only be set if the current user is either an Administrator

                        or a Project Lead on the account.'
                    cost_rate_in_cents:
                      type: integer
                      format: int32
                      description: 'The default cost rate, in cents, for the user in a workspace on this account. This attribute can

                        only be set if the current user is an Administrator on the account.'
                    default_read_only:
                      type: boolean
                      description: The invited user should have read-only permissions.
                    default_role_id:
                      type: integer
                      format: int32
                      description: The internal ID for the default role specified to the invited user.
                    email_address:
                      type: string
                      description: The email address of the invited user. A link to accept the invitation is sent to this address.
                    full_name:
                      type: string
                      description: The full name of the invited user.
                    headline:
                      type: string
                    permission:
                      type: string
                      description: 'The permission level of the invited user. See account_memberships for more details. Valid values

                        include administrator, reports_viewer_with_cost, reports_viewer, project_lead, project_creator, collaborator, and punch_clock.".'
                    external_reference:
                      type: object
                      description: 'Typically populated programmatically by a third party system via an integration, this is an optional

                        object that holds data from an external system. It connects objects in an external system with objects in

                        Kantata OX (for example, to connect a Jira issue to a Kantata OX Project).'
                      properties:
                        service_name:
                          type: string
                          description: The provider name of the integration. If you are adding multiple external references to the same object, the `service_name` must be unique.
                        service_model:
                          type: string
                          description: The object type of the external object this external reference belongs to.
                        service_model_ref:
                          type: string
                          description: The object ID of the external object this external reference belongs to.
                        status:
                          type: string
                          description: The status of the integration. Options are `successful`, `pending`,  or `failed`.
                        external_message:
                          type: string
                          description: The message on the external object.
                        external_link:
                          type: string
                          description: The link to the external object.
                        external_status:
                          type: string
                          description: The status of the external object in the external system.
                        locked:
                          type: boolean
                          description: Whether the subject is locked.
                      required:
                      - service_name
                      - service_model
                      - service_model_ref
                  required:
                  - email_address
                  - full_name
        required: true
  /account_invitations/{id}:
    get:
      summary: Fetching a single Account Invitation
      description: 'This endpoint returns structured Account Invitation objects.

        As with all Kantata OX API endpoints, the returned data will be referenced in sorted order in the `results` array

        and will be indexed by ID in the `account_invitations` top-level JSON key.

        Please see our [Response Format](#section/Response-Format) section for more information.'
      operationId: Get Account Invitation
      tags:
      - Account Invitations
      parameters:
      - in: path
        name: id
        required: true
        description: The ID of the Model.
        schema:
          type: integer
      - in: query
        name: include
        description: 'Any of the below associations can be included in your request by providing the `include` param, e.g. `include=association1,association2`.

          - `default_role` (Role) - The default role of the account.

          - `invitee` (User) - The new user who will receive the invitation.

          - `inviter` (User) - The user who has sent the invitation.'
