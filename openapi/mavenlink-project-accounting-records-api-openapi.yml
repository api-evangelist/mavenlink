  /project_accounting_records/import_csv:
    post:
      summary: Importing Project Account Records in a CSV
      description: 'Imports up to 5000 project accounting records with a

        [csv file](https://app.mavenlink.com/sample_import_project_accounting_records.csv)

        with a .txt or .csv extension.


        Each row/line is a record, and each record has attributes. Headers

        indicate which attributes are being specified for imported records.

        Headers can include:


        * **Project ID** (required)

        * **Story ID**

        * **Role ID**

        * **User ID**

        * **Type** (recommended)

        * **Period Start Date** (required)

        * **Period End Date** (required)

        * **Contract Date**

        * **Currency** (required)

        * **Revenue Method**

        * **Amount**

        * **Amount To Date**

        * **Forecast**

        * **Budget**

        * **Cost**

        * **Cost to Date**

        * **Cost EAC**

        * **Fees**

        * **Labor Type**

        * **Hours**

        * **Hours EAC**

        * **Hours ETC**

        * **Total Estimated Hours**

        * **Total Hours to Date**

        * **Percent Complete**

        * **Status**

        * **Service Type**

        * **Description**

        * **Notes**


        Only **Project ID**, **Period Start Date**, **Period End Date**,

        and **Currency** are required for a csv import. But when it is not specified,

        **Type** defaults to `Recognition`. Other valid values for **Type** are

        `Baseline`, `Earned Value`, `Earned Value Forecasting`, and `Forecasting`.



        This endpoint returns structured Project Accounting Records objects.

        As with all Kantata OX API endpoints, the returned data will be referenced in sorted order in the `results` array

        and will be indexed by ID in the `project_accounting_records` top-level JSON key.

        Please see our [Response Format](#section/Response-Format) section for more information.'
      operationId: Import Project Accounting Records
      tags:
      - Project Accounting Records
      parameters:
      - in: query
        name: include
        description: "Any of the below associations can be included in your request by providing the `include` param, e.g. `include=association1,association2`.\n- `external_references` (ExternalReference) - Includes references to external integrations for this object.\n- `role` (Role) - Includes the ID of the role associated with the record.\n- `story` (Story) - Includes the ID of the task related to the record.\n- `user` (User) - Includes the ID(s) of user(s) associated with the record\n                    (e.g. who created the record, who the record was created for, etc.).\n- `workspace` (Workspace) - Includes the ID of the project the record belongs to."
        schema:
          type: string
      responses:
        '200':
          description: Project Accounting Records has been created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int32
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        format: int32
                      page_count:
                        type: integer
                        format: int32
                      page_number:
                        type: integer
                        format: int32
                      page_size:
                        type: integer
                        format: int32
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        id:
                          type: string
                  project_accounting_records:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/ProjectAccounting__Models__ProjectAccountingRecord'
                  external_references:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/ExternalReference'
                  workspaces:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Workspace'
                  stories:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Story'
                  roles:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Role'
                  users:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: Forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: Page Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
