    ProjectAccounting__Models__ProjectAccountingRecord:
      title: Project Accounting Records
      description: Project accounting records.
      type: object
      properties:
        account_id:
          type: integer
          format: int32
          description: The ID of the account this record belongs to.
        amount:
          type: number
          format: float
          description: "The amount calculated for baseline, forecasting,\n              earned value, earned value forecasting, or revenue recognition\n              within the specified accounting period."
        amount_to_date:
          type: number
          format: float
          description: The total amount spent to date (for all accounting periods).
        budget:
          type: number
          format: float
          description: The budget of the project or task.
        calculated_revenue_amount:
          type: number
          format: float
          description: The calculated revenue amount for this accounting period.
        contract_date:
          type: string
          format: date
          description: A contract's start or end date, or any other designated date.
        cost:
          type: number
          format: float
          description: The cost of the project or task within the specified accounting period.
        cost_eac:
          type: number
          format: float
          description: "The [estimated cost](https://mavenlink.zendesk.com/hc/en-us/articles/360004619334-Project-Completion-Estimates)\n              of the project or task when it is completed. This updates during the course of a project or task, as costs are logged."
        cost_to_date:
          type: number
          format: float
          description: The total cost accumulated to date for this accounting period.
        created_at:
          type: string
          format: date
          description: The date the record was created.
        currency:
          type: string
          description: "The currency of the record. See the\n              [ISO codes of currencies supported by Kantata OX](https://mavenlink.zendesk.com/hc/en-us/articles/360041576473)."
        description:
          type: string
          description: A brief description of the record.
        end_date:
          type: string
          format: date
          description: The date the accounting period ends.
        external_reference_ids:
          type: array
          items:
            type: string
          description: '`external_reference_ids` will only be included in the response if `external_references` is in the list of included associations. See <a href=''#section/Includes''>include</a> section for usage.'
        fees:
          type: number
          format: float
          description: The fees from the specified accounting period.
        forecast:
          type: number
          format: float
          description: The forecast value for this accounting period.
        forecast_locked:
          type: boolean
          description: "Whether the forecast amount has been verified and locked, which happens when the previous period is closed.\n                If `true`, the forecast amount will not update if forecasted hours or expense budgets are added to the period."
        has_revenue_override:
          type: boolean
          description: Whether this record has a revenue override applied.
        hours:
          type: number
          format: float
          description: "The [hours](https://mavenlink.zendesk.com/hc/en-us/articles/360059325413)\n              spent within the specified accounting period."
        hours_eac:
          type: number
          format: float
          description: "The [estimated hours](https://mavenlink.zendesk.com/hc/en-us/articles/360004619334-Project-Completion-Estimates)\n              for the project or task when it is completed. This updates during the course of a project or task, as hours are logged."
        hours_etc:
          type: number
          format: float
          description: "The [estimated hours](https://mavenlink.zendesk.com/hc/en-us/articles/360004619334-Project-Completion-Estimates)\n              until completion (`hours_eac` - `hours`) of the project or task."
        labor_type:
          type: string
          description: Whether the cost associated with the record is for `Labor` or `Non-Labor`.
        notes:
          type: string
          description: Extra information to note about the record.
        percent_complete:
          type: number
          format: float
          description: How much of the project or task is complete in decimal format (e.g. 0.75 = 75%).
        remaining_forecast:
          type: number
          format: float
          description: 'The remaining forecast amount for an Open period. If the period is not Open, this is `null`.

            This field may only have a value when the

            [early access feature Revenue Management](https://knowledge.kantata.com/hc/en-us/articles/38986877019803-Revenue-Management-Early-Access)

            is activated on the account.'
        revenue_method:
          type: string
          description: The name of the revenue recognition method from the project accounting record.
        revenue_override_notes:
          type: string
          description: 'A user-entered note added when manually overriding the calculated revenue value on a project accounting record.

            This field may only have a value when the

            [early access feature Revenue Management](https://knowledge.kantata.com/hc/en-us/articles/38986877019803-Revenue-Management-Early-Access)

            is activated on the account.'
        role_id:
          type: string
          description: '`role_id` will only be included in the response if `role` is in the list of included associations. See <a href=''#section/Includes''>include</a> section for usage.'
        service_type:
          type: string
          description: "An organization-specific category of services\n              that is related to the record (e.g. Branding, Campaigns, Photography, etc.)."
        start_date:
          type: string
          format: date
          description: The date the accounting period begins.
        status:
          type: string
          description: The status of the record (`Unsubmitted`, `Draft`, `Pending Approval`, `Approved`, `Cancelled`, `Reopened`, or `Adjusted`).
        story_id:
          type: string
          description: '`story_id` will only be included in the response if `story` is in the list of included associations. See <a href=''#section/Includes''>include</a> section for usage.'
        system_generated:
          type: boolean
          description: Whether this record was generated by the system as part of Kantata's revenue recognition process.
        total_estimated_hours:
          type: number
          format: float
          description: "The hours initially estimated for the project or task.\n              This value does not change over the course of a project."
        total_hours_to_date:
          type: number
          format: float
          description: The total hours logged to date for the project or task.
        type:
          type: string
          description: "The type of project accounting record (`Baseline`, `Earned Value`,\n                `Earned Value Forecasting`, `Forecasting`, or `Recognition`)."
        user_id:
          type: string
          description: '`user_id` will only be included in the response if `user` is in the list of included associations. See <a href=''#section/Includes''>include</a> section for usage.'
        workspace_id:
          type: string
          description: '`workspace_id` will only be included in the response if `workspace` is in the list of included associations. See <a href=''#section/Includes''>include</a> section for usage.'
    User:
