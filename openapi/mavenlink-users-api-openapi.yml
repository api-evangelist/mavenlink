                        Kantata OX (for example, to connect a Jira issue to a Kantata OX Project).'
                      properties:
                        service_name:
                          type: string
                          description: The provider name of the integration. If you are adding multiple external references to the same object, the `service_name` must be unique.
                        service_model:
                          type: string
                          description: The object type of the external object this external reference belongs to.
                        service_model_ref:
                          type: string
                          description: The object ID of the external object this external reference belongs to.
                        status:
                          type: string
                          description: The status of the integration. Options are `successful`, `pending`,  or `failed`.
                        external_message:
                          type: string
                          description: The message on the external object.
                        external_link:
                          type: string
                          description: The link to the external object.
                        external_status:
                          type: string
                          description: The status of the external object in the external system.
                        locked:
                          type: boolean
                          description: Whether the subject is locked.
                      required:
                      - service_name
                      - service_model
                      - service_model_ref
        required: true
  /users/{id}/capacity:
    get:
      summary: Fetch My Work Capacity
      description: 'This endpoint returns a summary of a user''s work capacity for a provided range of dates.



        This endpoint returns structured User objects.

        As with all Kantata OX API endpoints, the returned data will be referenced in sorted order in the `results` array

        and will be indexed by ID in the `users` top-level JSON key.

        Please see our [Response Format](#section/Response-Format) section for more information.'
      operationId: Get My Work Capacity
      tags:
      - Users
      parameters:
      - in: query
        name: end_date
        required: true
        description: The end date for calculating my work capacity in YYYY-MM-DD format (e.g. 2016-01-01). The date must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
        schema:
          type: string
          format: date
      - in: path
        name: id
        required: true
        description: The ID of the Model.
        schema:
          type: integer
      - in: query
        name: start_date
        required: true
        description: The start date for calculating my work capacity in YYYY-MM-DD format (e.g. 2015-12-16). The date must be in [ISO 8601](https://www.w3.org/TR/NOTE-datetime) format.
        schema:
          type: string
          format: date
      - in: query
        name: include
        description: 'Any of the below associations can be included in your request by providing the `include` param, e.g. `include=association1,association2`.

          - `account_membership` (AccountMembership) - Retrieves the account membership of the user, which represents the relationship of a user to an account. The response will include `account_membership_id`, which references the data in the `account_memberships` top-level key.

          - `custom_field_values` (CustomFieldValue) - Retrieves the user''s custom field values that are viewable for the current user. The response will include `custom_field_value_ids`, which references the data in the `custom_field_values` top-level key.

          - `external_references` (ExternalReference) - Includes references to external integrations for this object.

          - `manager` (User) - Retrieves the user''s manager. The response will include `manager_id`, which references the data in the `users` top-level key.

          - `role` (Role) - Retrieves the user''s account role. The response will include `role_id`, which references the data in the `roles` top-level key.

          - `skill_memberships` (SkillMembership) - Retrieves the skill memberships of the user, which represent skills that have been assigned to a user. The response will include `skill_membership_ids`, which references the data in the `skill_memberships` top-level key. The `skill_memberships` data will include the user''s proficiency level (for skills which can be assigned proficiency levels).

          - `skills` (Skill) - Retrieves the user''s skills. The response will include `skill_ids`, which references the data in the `skills` top-level key. The `skills` data will include the skill description and category ID.

          - `work_samples` (WorkSample) - Retrieves the user''s portfolio items. The response will include `work_sample_ids`, which references the data in the `work_samples` top-level key.'
        schema:
          type: string
      - in: query
        name: optional_fields
        description: Allows you to request one or more optional fields as an array.
        schema:
          type: array
          items:
            type: string
            enum:
            - bio
            - website
            - city
            - state
            - country
            - abbreviated_timezone
            - last_site_activity
            - classification
      responses:
        '200':
          description: A list of Users have been retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  start_date:
                    type: string
                    format: date
                    description: The start date for calculating my work capacity in YYYY-MM-DD format (e.g. 2012-09-27).
                  end_date:
                    type: string
                    format: date
                    description: The end date for calculating my work capacity in YYYY-MM-DD format (e.g. 2012-09-27).
                  hours:
                    type: object
                    additionalProperties:
                      type: number
                      format: float
                      description: The key is the date, and the value is my work capacity on that date.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: Forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: Page Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
