source: https://developer.kantata.com/ (Rate Limits section)
limit_count: 0
note: >-
  Kantata documents THAT the API is rate limited and WHICH endpoints carry their own additional limits, but not
  what any of the limits are. The API reference says "When too many requests are made in a short amount of time,
  the API may reply with the HTTP code 429 Too Many Requests. In that case, simply retry your request after a
  small delay. There are general rate limits applied to all requests," then defers the actual numbers to a
  knowledge-base article. That article (9698066628123) is behind the customer login: an anonymous fetch 302s to
  https://app.mavenlink.com/login?from_redirect=true. So the numbers exist and are published to customers, but
  no number is publicly readable - limit_count is 0 because there is nothing public to record, not because the
  API is unlimited.
status_on_exhaustion: 429
retry_guidance: >-
  "Simply retry your request after a small delay." No backoff schedule, no jitter guidance, no maximum retry
  count is published.
response_headers: []
response_headers_note: >-
  No RateLimit-*, X-RateLimit-* or Retry-After response header is documented in the API reference, declared in
  the 419-operation Swagger contract, or observed on live responses from api.mavenlink.com. A probe of
  GET https://api.mavenlink.com/api/v1/workspaces.json (2026-08-25, HTTP 401 unauthenticated) returned only
  cache-control, x-request-id, x-runtime, strict-transport-security and the standard security headers - no
  rate-limit signal of any kind. An agent therefore cannot see how close it is to a limit; it can only discover
  the limit by hitting it.
