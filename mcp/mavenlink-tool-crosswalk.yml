notes: >-
  Kantata runs two MCP servers. Only ONE of them can be crosswalked against the REST contract, and it is not the
  one that matters most: the DOCUMENTATION server at developer.kantata.com is anonymous, so its six tools and
  their inputSchemas are known exactly - but none of them binds to a Kantata OX REST operation, because they
  operate on the OpenAPI document rather than on Kantata data. The PRODUCT server at api.mavenlink.com/mcp,
  which does read and write Kantata OX data, returns an OAuth challenge to anonymous tools/list, so its tools
  are unknown and are deliberately NOT crosswalked - mapping guessed tool names onto real operationIds would
  fabricate the exact thing this artifact exists to record.
